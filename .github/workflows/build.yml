name: Build FreeJ2ME-Plus JAR

on:
  push:
    branches: [ devel, main, master ]
  pull_request:
    branches: [ devel, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Ant
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Ant (fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Build with Ant
        run: |
          ant -f build.xml

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Find and copy built JARs
        run: |
          find . -name "*.jar" -not -path "./.git/*" | head -10
          cp -v build/*.jar artifacts/ 2>/dev/null || true
          cp -v dist/*.jar artifacts/ 2>/dev/null || true
          cp -v *.jar artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freej2me-plus-jar
          path: artifacts/
          retention-days: 30

      - name: Create Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
