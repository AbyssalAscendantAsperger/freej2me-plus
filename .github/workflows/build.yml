name: Build & Release FreeJ2ME-Plus

on:
  push:
    branches: [ devel, main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Build with Ant
        run: ant -f build.xml

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          find . -name "*.jar" -not -path "./.git/*" -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -la artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freej2me-plus
          path: artifacts/
          retention-days: 30

      # Tự động tạo Release khi push tag
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}